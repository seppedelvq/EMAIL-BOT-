name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install local frontend
        run: npm --prefix playground ci

      - name: Type check frontend
        run: npm --prefix playground run typecheck

      - name: Build local assistant
        run: npm --prefix playground run build
        env:
          ASSISTANT_SCHEDULER: '0'
          NEXT_TELEMETRY_DISABLED: '1'
